name: QuantPulse backend checks

on:
  push:
    paths:
      - "services/backend/**"
      - ".github/workflows/quantpulse-backend.yml"
  pull_request:
    paths:
      - "services/backend/**"
      - ".github/workflows/quantpulse-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: pytest -q
