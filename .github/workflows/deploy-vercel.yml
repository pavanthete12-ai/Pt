name: Deploy QuantPulse Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install
      - name: Build web
        run: npm --workspace @shadow-ai/web run build
        env:
          NEXT_PUBLIC_QUANTPULSE_API_URL: ${{ secrets.NEXT_PUBLIC_QUANTPULSE_API_URL }}
          NEXT_PUBLIC_QUANTPULSE_WS_URL: ${{ secrets.NEXT_PUBLIC_QUANTPULSE_WS_URL }}
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel project
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Vercel artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production artifacts
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
